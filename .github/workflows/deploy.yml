# push main 或每日排程 → （排程時）抓 NOAA 最新海況 → 驗證 → 部署到 GitHub Pages
# NOAA 抓取失敗不擋部署：沿用 repo 內上一次的資料（M03 資料串接）
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *' # 每天台北 06:00
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - name: 更新 NOAA 海況（排程時）
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: uv run etl/fetch_ocean.py
      - name: 更新 GFW 周邊漁船活動與港口（排程且有 token 時）
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
        run: if [ -n "$GFW_TOKEN" ]; then uv run etl/fetch_gfw.py && uv run etl/fetch_ports.py; else echo "沒有 GFW_TOKEN，沿用 repo 內資料"; fi
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
